<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seans — Film Kulübü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,500&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1417; --ink-2:#161F24; --cream:#EDE7D8; --cream-dim:#B9B2A0;
    --amber:#E4A23E; --moss:#5C7A67; --rule:rgba(237,231,216,0.14); --rule-strong:rgba(237,231,216,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--cream); font-family:'Newsreader', serif; -webkit-font-smoothing:antialiased;}
  a{color:var(--amber); text-decoration:none;}
  .wrap{max-width:720px; margin:0 auto; padding:0 32px;}
  nav{position:sticky; top:0; z-index:100; background:rgba(14,20,23,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule);}
  nav .inner{max-width:720px; margin:0 auto; padding:0 32px; height:76px; display:flex; align-items:center; justify-content:space-between;}
  .wordmark{font-family:'Fraunces', serif; font-size:20px; font-weight:600;}
  .wordmark em{color:var(--amber); font-style:italic; font-weight:500;}
  .back{font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;}
  main{padding:64px 0 100px;}
  .seans-no{font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.1em; color:var(--moss);}
  h1{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(30px,4vw,46px); line-height:1.1; margin-top:14px;}
  .meta{display:flex; flex-wrap:wrap; gap:10px 24px; font-family:'Space Mono', monospace; font-size:12px; color:var(--cream-dim); margin-top:22px; padding:18px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);}
  .meta b{color:var(--cream); font-weight:400;}
  .podcast{margin-top:28px; padding:18px 20px; background:var(--ink-2); border:1px solid var(--rule); border-radius:2px; font-family:'Space Mono', monospace; font-size:12px;}
  .body-text{margin-top:36px; font-size:18px; line-height:1.8; color:var(--cream);}
  .body-text p{margin-bottom:20px;}
  .notfound{padding:120px 0; text-align:center; font-family:'Space Mono', monospace; color:var(--cream-dim);}
</style>
</head>
<body>
<nav><div class="inner">
  <div class="wordmark">Seans <em>Defteri</em></div>
  <a class="back" href="index.html">← Arşive dön</a>
</div></nav>

<main class="wrap"><div id="content">
  <div class="notfound">Yükleniyor…</div>
</div></main>

<script>
  const AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  function fmtTarih(iso){ const d = new Date(iso+"T00:00:00"); return `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}`; }

  async function boot(){
    const no = new URLSearchParams(location.search).get('no');
    const el = document.getElementById('content');
    let data;
    try{
      const res = await fetch('data/seanslar.json', {cache:'no-store'});
      data = await res.json();
    }catch(e){
      el.innerHTML = '<div class="notfound">seanslar.json okunamadı.</div>';
      return;
    }
    const s = (data.seanslar || []).find(x => String(x.no) === String(no));
    if(!s){
      el.innerHTML = '<div class="notfound">Bu seans bulunamadı.</div>';
      return;
    }
    el.innerHTML = `
      <div class="seans-no">SEANS № ${String(s.no).padStart(3,'0')} — ${fmtTarih(s.tarih).toUpperCase()}</div>
      <h1>${s.altBaslik || s.baslik}</h1>
      <div class="meta">
        <span>Film: <b>${s.baslik}</b></span>
        <span>Yönetmen: <b>${s.yonetmen || '—'}</b></span>
        <span>Katılımcılar: <b>${s.katilimci || '—'} kişi</b></span>
        <span>Süre: <b>${s.sure || '—'}</b></span>
      </div>
      ${s.podcastUrl ? `<div class="podcast">🎧 Bu seansın kaydını dinlemek için: <a href="${s.podcastUrl}" target="_blank">${s.podcastUrl}</a></div>` : ''}
      <div class="body-text">${s.metin || '<p>Bu seans için henüz bir metin eklenmedi.</p>'}</div>
    `;
  }
  boot();
</script>
</body>
</html>
