<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESAFE Seans Defteri</title>
<style>body{background:#0E1417;color:#B9B2A0;font-family:monospace;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center;padding:20px}a{color:#E4A23E}</style>
<script>
  // Eski adres (seans.html?no=2) artık /seans/<film-adi>/ sayfasına taşındı.
  function slugify(t){
    return String(t || '').toLocaleLowerCase('tr-TR')
      .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-');
  }
  var no = new URLSearchParams(location.search).get('no');
  fetch('/data/seanslar.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    var list = (d.seanslar || []).filter(function(s){ return s && s.yayinda !== false && s.no != null && s.baslik; }).sort(function(a,b){ return a.no - b.no; });
    var used = {}, target = '/';
    list.forEach(function(s){ var sl = slugify(s.baslik) || ('seans-' + s.no); if (used[sl]) sl = sl + '-' + s.no; used[sl] = true; if (String(s.no) === String(no)) target = '/seans/' + sl + '/'; });
    location.replace(target);
  }).catch(function(){ location.replace('/'); });
</script>
</head>
<body><p>Sayfa taşındı — <a href="/">MESAFE Seans Defteri</a></p></body>
</html>
